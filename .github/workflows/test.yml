name: Test demos

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            demos/dachshund-gatekeeper/ui/package-lock.json
            demos/omnicode/ui/package-lock.json
      - name: Install native decoder headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++ libzxing-dev
      - name: Compile Python sources
        run: python -m py_compile demos/*/*.py
      - name: Check shell syntax
        run: bash -n scripts/*.sh
      - name: Test Gatekeeper policy
        run: python -m unittest -v demos/dachshund-gatekeeper/test_gatekeeper_core.py
      - name: Build Gatekeeper UI
        working-directory: demos/dachshund-gatekeeper/ui
        run: |
          npm ci
          npm run build
      - name: Compile OmniCode decoder ABI
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror -fPIC -shared
          demos/omnicode/decoder/omnicode_decoder.cpp
          -o /tmp/libomnicode-decoder.so -lZXing
      - name: Build OmniCode UI
        working-directory: demos/omnicode/ui
        run: |
          npm ci
          npm run build
